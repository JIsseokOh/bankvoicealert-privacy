plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Optional per-machine build directory (e.g. outside a cloud-synced folder, where file locks
// break clean builds). Set "app.buildDir=<path>" in local.properties or the
// BANKVOICEALERT_BUILD_DIR environment variable; otherwise the default app/build is used.
def localPropertiesFile = rootProject.file("local.properties")
def localProperties = new Properties()
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def customBuildDir = localProperties.getProperty("app.buildDir") ?: System.getenv("BANKVOICEALERT_BUILD_DIR")
if (customBuildDir) {
    layout.buildDirectory.set(file(customBuildDir))
}

android {
    namespace 'com.family.bankvoicealert'
    compileSdk 36

    defaultConfig {
        applicationId "com.family.bankvoicealert"
        // Play automatic integrity protection requires minSdk 24 or higher
        minSdk 24
        targetSdk 36
        versionCode 119
        versionName "1.3.88"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Gemini API key from keystore.properties
        buildConfigField "String", "GEMINI_API_KEY", "\"${keystoreProperties['geminiApiKey'] ?: ''}\""
    }

    signingConfigs {
        release {
            storeFile file('../keystore/release-keystore.jks')
            storePassword keystoreProperties['storePassword'] ?: System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias keystoreProperties['keyAlias'] ?: System.getenv("KEY_ALIAS") ?: ""
            keyPassword keystoreProperties['keyPassword'] ?: System.getenv("KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            // R8 code shrinking and obfuscation: required by Google Play's DEX code
            // optimization check (obfuscation ratio must be at least 25%)
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Kotlin stdlib
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22"

    // Google AdMob for ads
    implementation 'com.google.android.gms:play-services-ads:23.0.0'

    // Gson for JSON serialization
    implementation 'com.google.code.gson:gson:2.10.1'

    // 테스트
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22"
        force "org.jetbrains.kotlin:kotlin-stdlib-common:1.9.22"
    }
}
